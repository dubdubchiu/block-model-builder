[project]
name = "block-model-builder"
version = "0.0.0"
description = "Workspace root for the block model builder (engine and server)."
requires-python = ">=3.12"
dependencies = ["blockmodel", "blockmodel-server"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx2",
    # Oracle only: tests import the reference model's numpy evaluator (generator/dsl.py).
    "scipy>=1.13",
    "openpyxl>=3.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "server"]

[tool.uv.sources]
blockmodel = { workspace = true }
blockmodel-server = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["engine/tests", "server/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["models/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # ruff format owns line length; long messages stay on one line
