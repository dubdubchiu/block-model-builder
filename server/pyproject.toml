[project]
name = "blockmodel-server"
version = "0.0.0"
description = "FastAPI server wrapping the blockmodel engine."
requires-python = ">=3.12"
dependencies = ["blockmodel", "fastapi>=0.115", "uvicorn>=0.30"]

[tool.uv.sources]
blockmodel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
