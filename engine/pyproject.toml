[project]
name = "blockmodel"
version = "0.0.0"
description = "Block model engine: data model, validation, evaluation, export."
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pydantic>=2.7", "xlsxwriter>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blockmodel"]
